<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kenrick & Joyce Ann Wedding Invitation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="book">
    <!-- Cover Page -->
    <div class="page" id="cover">
      <h1 class="fade-in delay1">Kenrick & Joyce Ann</h1>
      <p class="fade-in delay2">Wedding Invitation</p>
      <p class="hint fade-in delay3">Click to open</p>
    </div>

    <!-- Details Page -->
    <div class="page" id="details">
      <h1 class="fade-in delay1">Wedding Day</h1>
      <p class="fade-in delay2">May 11, 2027</p>
      <p class="fade-in delay2">2:00 PM — Parish of Immaculate Heart of Mary</p>
      <p class="fade-in delay2">3:30 PM — The Chandelier Events Place</p>
      <div class="gallery fade-in delay3">
        <img src="images/proposal.jpg" alt="Proposal moment">
        <img src="images/ring.jpg" alt="Engagement ring">
        <img src="images/couple.jpg" alt="Kenrick and Joyce Ann">
      </div>
    </div>
  </div>

  <!-- Background Music -->
  <audio id="bg-music" src="audio/music.mp3" preload="auto"></audio>
  <button id="music-toggle">🔈 Mute</button>

  <script src="script.js"></script>
</body>
</html>
